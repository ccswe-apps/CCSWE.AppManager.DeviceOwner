name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# packages: write is required by the shared workflow's publish job, even though
# it never runs here (no publish-image).
permissions:
  contents: read
  checks: write
  packages: write
  pull-requests: read

jobs:
  # Keep the id: the required check is `pipeline / build`.
  pipeline:
    uses: ccswe-apps/actions/.github/workflows/dotnet-build-app.yml@master
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
